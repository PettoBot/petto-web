name = "petto-web"
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-07-26"
# The dashboard's session cookie signing and Supabase calls use Node APIs (crypto, Buffer),
# which Workers only exposes with this flag on.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Everything Astro prerendered (the marketing site, /assets, /_astro) is served straight from
# static assets. Only the routes Astro left dynamic (/dash/**) fall through to the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"

# Plain (non-secret) vars have to live here, not just in the Cloudflare dashboard: every
# `wrangler deploy` replaces the Worker's bindings with whatever this file declares, so
# anything set only through the dashboard gets silently dropped on the next deploy. Secrets
# (DISCORD_TOKEN, DISCORD_CLIENT_SECRET, PETTO_BOT_API_SECRET) stay dashboard-managed,
# wrangler re-attaches those automatically and they should never sit in a committed file.
# PETTO_BOT_API_SECRET is also a dashboard-managed secret and must match the bot's
# PETTO_DASHBOARD_API_SECRET. It is only used by server-side Worker requests.
[vars]
PETTO_BOT_API_URL = "https://api.petto.sbs"
