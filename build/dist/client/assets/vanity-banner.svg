<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Vanity moves to Petto">
  <!-- Vanity moves to Petto banner. Hand-written vectors, no images. The important parts sit between x=130 and x=550 so a 16/9 crop keeps them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#2a1f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#f0a9c4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f0a9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a88f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0a88f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f2f1ed" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25272c"/>
      <stop offset="1" stop-color="#1f2125"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <path id="spark" d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z"/>
  </defs>

  <rect width="680" height="240" fill="url(#bg)"/>
  <rect width="680" height="240" fill="url(#dots)"/>
  <ellipse cx="340" cy="130" rx="260" ry="140" fill="url(#glow)"/>
  <ellipse cx="500" cy="170" rx="140" ry="90" fill="url(#glow2)"/>

  <!-- The two bots: Vanity on the left, Petto on the right, a role tag travelling between them -->
  <g filter="url(#shadow)">
    <rect x="140" y="82" width="150" height="76" rx="16" fill="url(#card)" stroke="#3a3d44"/>
    <circle cx="176" cy="120" r="18" fill="#f0a9c4" fill-opacity="0.18" stroke="#f0a9c4" stroke-opacity="0.6"/>
    <use href="#spark" x="176" y="120" fill="#f0a9c4"/>
    <text x="206" y="126" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f2f1ed">Vanity</text>

    <rect x="390" y="82" width="150" height="76" rx="16" fill="url(#card)" stroke="#f0a88f" stroke-opacity="0.7"/>
    <circle cx="426" cy="120" r="18" fill="#f0a88f" fill-opacity="0.2" stroke="#f0a88f" stroke-opacity="0.7"/>
    <path d="M419 121l5 5 10-11" fill="none" stroke="#f0a88f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="456" y="126" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f2f1ed">Petto</text>
  </g>

  <path d="M300 120h72" stroke="#f0a9c4" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M364 110l12 10-12 10" fill="none" stroke="#f0a9c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="304" y="164" width="68" height="24" rx="12" fill="#f0a9c4" fill-opacity="0.16" stroke="#f0a9c4" stroke-opacity="0.55"/>
  <text x="338" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0a9c4">@Rep</text>

  <use href="#spark" x="118" y="60" fill="#f0a9c4" fill-opacity="0.7"/>
  <use href="#spark" x="566" y="196" fill="#f0a88f" fill-opacity="0.7"/>
  <use href="#spark" x="548" y="52" fill="#f2f1ed" fill-opacity="0.4" transform="translate(548 52) scale(0.6) translate(-548 -52)"/>
</svg>
