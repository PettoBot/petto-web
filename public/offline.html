<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#18191d">
<title>Petto</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #18191d; color: #d6d3cc; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 340px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 16px 0 6px; font: 600 22px/1.25 Georgia, "Times New Roman", serif; color: #f0a88f; }
  p { margin: 0 0 20px; color: #9b978f; }
  button { padding: 10px 22px; border: 1px solid #34373e; border-radius: 12px; background: #212328; color: inherit; font: inherit; cursor: pointer; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<main>
  <img src="/assets/pwa/icon-192.png" alt="" width="72" height="72">
  <h1 id="t">No connection</h1>
  <p id="d">Petto cannot reach the internet right now. Check your connection and try again.</p>
  <button id="b" type="button">Try again</button>
</main>
<script>
  var text = {
    es: ['Sin conexión', 'Petto no puede conectarse a internet ahora. Revisa tu conexión e inténtalo de nuevo.', 'Reintentar'],
    pt: ['Sem conexão', 'O Petto não consegue acessar a internet agora. Verifique sua conexão e tente de novo.', 'Tentar de novo']
  };
  var lang = String(navigator.language || 'en').slice(0, 2).toLowerCase();
  var copy = text[lang];
  if (copy) { document.documentElement.lang = lang; document.getElementById('t').textContent = copy[0]; document.getElementById('d').textContent = copy[1]; document.getElementById('b').textContent = copy[2]; }
  document.getElementById('b').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
