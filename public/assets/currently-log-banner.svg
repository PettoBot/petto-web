<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Cards in the colors of the Currently log: red, yellow, green, blue, orange, purple, gray and black">
  <!-- Banner of the post about the Currently log. The important parts sit between x=130 and x=550 so a 16/9 crop keeps them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c20"/><stop offset="1" stop-color="#2a1f24"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5"><stop offset="0" stop-color="#f0a9c4" stop-opacity="0.28"/><stop offset="1" stop-color="#f0a9c4" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f2f1ed" fill-opacity="0.07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="680" height="240" fill="url(#bg)"/>
  <rect width="680" height="240" fill="url(#dots)"/>
  <ellipse cx="340" cy="130" rx="260" ry="140" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="150" y="34" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="150" y="34" width="6" height="30" rx="3" fill="#e03131"/>
    <text x="170" y="54" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Security</text>
    <rect x="346" y="34" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="346" y="34" width="6" height="30" rx="3" fill="#fcc419"/>
    <text x="366" y="54" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">New feature</text>
    <rect x="150" y="72" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="150" y="72" width="6" height="30" rx="3" fill="#2f9e44"/>
    <text x="170" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Added</text>
    <rect x="346" y="72" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="346" y="72" width="6" height="30" rx="3" fill="#1c7ed6"/>
    <text x="366" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Improvement</text>
    <rect x="150" y="110" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="150" y="110" width="6" height="30" rx="3" fill="#f76707"/>
    <text x="170" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Fix</text>
    <rect x="346" y="110" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="346" y="110" width="6" height="30" rx="3" fill="#9c36b5"/>
    <text x="366" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Web &amp; docs</text>
    <rect x="150" y="148" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="150" y="148" width="6" height="30" rx="3" fill="#868e96"/>
    <text x="170" y="168" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Removed</text>
    <rect x="346" y="148" width="184" height="30" rx="8" fill="#25272c" stroke="#32353b"/><rect x="346" y="148" width="6" height="30" rx="3" fill="#000000" stroke="#3a3d44"/>
    <text x="366" y="168" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f1ed">Feature removed</text>
  </g>
  <text x="340" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8d9097">CURRENTLY LOG</text>
</svg>
