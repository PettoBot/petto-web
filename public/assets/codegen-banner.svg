<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Petto Code Generator">
  <!-- Petto Code Generator banner. Hand-written vectors, no images. The important parts sit between x=130 and x=550 so a 16/9 crop keeps them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#2a1f1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#f0a88f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f0a88f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9aa8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9aa8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f2f1ed" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25272c"/>
      <stop offset="1" stop-color="#1f2125"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <path id="spark" d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z"/>
  </defs>

  <!-- Background -->
  <rect width="680" height="240" fill="url(#bg)"/>
  <rect width="680" height="240" fill="url(#dots)"/>
  <ellipse cx="330" cy="140" rx="260" ry="150" fill="url(#glow)"/>
  <ellipse cx="500" cy="170" rx="140" ry="90" fill="url(#glow2)"/>

  <!-- Big faint braces on the sides (only seen on wide crops) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#f0a88f" fill-opacity="0.1">
    <text x="22" y="168" font-size="132">{{</text>
    <text x="548" y="168" font-size="132">}}</text>
  </g>

  <!-- Sparkles -->
  <g fill="#f0a88f">
    <use href="#spark" transform="translate(150 70) scale(0.9)"/>
    <use href="#spark" transform="translate(136 96) scale(0.5)" fill-opacity="0.7"/>
    <use href="#spark" transform="translate(548 58) scale(0.7)" fill="#fed53c"/>
    <use href="#spark" transform="translate(536 210) scale(0.45)" fill="#a5ea7a"/>
  </g>

  <!-- Title -->
  <g font-family="'Petto Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="340" y="38" font-size="17" font-weight="700" fill="#f2f1ed">Petto <tspan fill="#f0a88f">Code Generator</tspan></text>
  </g>

  <!-- Editor card -->
  <g filter="url(#shadow)">
    <rect x="166" y="54" width="282" height="164" rx="14" fill="url(#card)" stroke="#3a3d44"/>
  </g>
  <path d="M166 68a14 14 0 0 1 14-14h254a14 14 0 0 1 14 14v8H166Z" fill="#2b2d33"/>
  <circle cx="182" cy="66" r="3.6" fill="#fe6465"/>
  <circle cx="194" cy="66" r="3.6" fill="#fed53c"/>
  <circle cx="206" cy="66" r="3.6" fill="#a5ea7a"/>
  <rect x="222" y="58" width="58" height="18" rx="5" fill="#212328"/>
  <text x="251" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#d8d5ce">!hello</text>
  <rect x="166" y="76" width="30" height="120" fill="#1b1c20" fill-opacity="0.6"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" xml:space="preserve">
    <g fill="#79756d" text-anchor="end">
      <text x="189" y="94">1</text>
      <text x="189" y="112">2</text>
      <text x="189" y="130">3</text>
      <text x="189" y="148">4</text>
      <text x="189" y="166">5</text>
      <text x="189" y="184">6</text>
    </g>
    <text x="204" y="94"><tspan fill="#f08fd6">{{</tspan><tspan fill="#c9a2ff"> $name</tspan><tspan fill="#d8d5ce"> := </tspan><tspan fill="#7fd8e0">.User.Username</tspan><tspan fill="#f08fd6"> }}</tspan></text>
    <text x="204" y="112"><tspan fill="#d8d5ce">Hello </tspan><tspan fill="#f08fd6">{{</tspan><tspan fill="#c9a2ff"> $name</tspan><tspan fill="#f08fd6"> }}</tspan><tspan fill="#d8d5ce">!</tspan></text>
    <text x="204" y="130"><tspan fill="#f08fd6">{{</tspan><tspan fill="#c9a2ff"> $p</tspan><tspan fill="#d8d5ce"> := </tspan><tspan fill="#8fb4ff">dbRank</tspan><tspan fill="#a5ea7a"> "coins"</tspan><tspan fill="#7fd8e0"> .User.ID</tspan><tspan fill="#f08fd6"> }}</tspan></text>
    <text x="204" y="148"><tspan fill="#d8d5ce">You are #</tspan><tspan fill="#f08fd6">{{</tspan><tspan fill="#c9a2ff"> $p</tspan><tspan fill="#f08fd6"> }}</tspan><tspan fill="#d8d5ce">.</tspan></text>
    <text x="204" y="166"><tspan fill="#f08fd6">{{</tspan><tspan fill="#8fb4ff"> deleteResponse</tspan><tspan fill="#fed53c"> 30</tspan><tspan fill="#f08fd6"> }}</tspan></text>
    <text x="204" y="184" fill="#79756d">{{/* try it first */}}</text>
  </g>
  <rect x="166" y="196" width="282" height="1" fill="#34373e"/>
  <circle cx="182" cy="207" r="3.5" fill="#a5ea7a"/>
  <text x="192" y="210.5" font-family="'Petto Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a5ea7a">The code is fine.</text>

  <!-- Discord-like test message with buttons -->
  <g filter="url(#shadow)">
    <rect x="400" y="140" width="146" height="64" rx="10" fill="#313338" stroke="#1e1f22"/>
  </g>
  <g font-family="'Petto Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="417" cy="157" r="9" fill="#f0a88f"/>
    <circle cx="414" cy="155" r="1.3" fill="#2b1a13"/>
    <circle cx="420" cy="155" r="1.3" fill="#2b1a13"/>
    <path d="M413 158.5q4 3.6 8 0" fill="none" stroke="#2b1a13" stroke-width="1.5" stroke-linecap="round"/>
    <text x="432" y="155" font-size="10" font-weight="700" fill="#f2f3f5">Petto</text>
    <rect x="461" y="147" width="22" height="10" rx="3" fill="#5865f2"/>
    <text x="472" y="154.6" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">APP</text>
    <text x="432" y="168" font-size="8.5" fill="#dbdee1">Hello Liam! You are #3.</text>
    <rect x="432" y="176" width="54" height="19" rx="4" fill="#5865f2"/>
    <text x="459" y="188.8" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Try it</text>
    <rect x="491" y="176" width="46" height="19" rx="4" fill="#4e5058"/>
    <text x="514" y="188.8" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Share</text>
  </g>

  <!-- Magic wand -->
  <g transform="translate(112 152) rotate(-38)">
    <rect x="0" y="-4" width="52" height="8" rx="4" fill="#f2f1ed"/>
    <rect x="0" y="-4" width="14" height="8" rx="4" fill="#f0a88f"/>
  </g>
</svg>
