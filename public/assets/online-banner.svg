<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="A bot listed as online without the green dot">
  <!-- Banner of the post about bots that show as online without a status dot. The important parts sit between x=130 and x=550 so a 16/9 crop keeps them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c20"/><stop offset="1" stop-color="#2a1f24"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5"><stop offset="0" stop-color="#f0a9c4" stop-opacity="0.28"/><stop offset="1" stop-color="#f0a9c4" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f2f1ed" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25272c"/><stop offset="1" stop-color="#1f2125"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <path id="spark" d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z"/>
  </defs>
  <rect width="680" height="240" fill="url(#bg)"/>
  <rect width="680" height="240" fill="url(#dots)"/>
  <ellipse cx="340" cy="130" rx="260" ry="140" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="150" y="38" width="380" height="162" rx="18" fill="url(#card)" stroke="#3a3d44"/>
    <text x="176" y="78" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#8d9097">BOTS - 2</text>
    <!-- a bot with the green dot -->
    <circle cx="190" cy="112" r="18" fill="#f0a9c4" fill-opacity="0.35"/>
    <circle cx="204" cy="126" r="7" fill="#1f2125"/><circle cx="204" cy="126" r="5" fill="#3ba55d"/>
    <text x="222" y="117" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#f2f1ed">a bot</text>
    <rect x="270" y="102" width="38" height="18" rx="5" fill="#5865f2"/><text x="289" y="115" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">APP</text>
    <text x="222" y="136" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8d9097">gateway · green dot and status</text>
    <line x1="176" y1="148" x2="504" y2="148" stroke="#32353b"/>
    <!-- a bot online with no dot -->
    <circle cx="190" cy="172" r="18" fill="#f0a88f" fill-opacity="0.4"/>
    <text x="222" y="170" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#f2f1ed">feed</text>
    <rect x="258" y="155" width="38" height="18" rx="5" fill="#5865f2"/><text x="277" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">APP</text>
    <text x="222" y="187" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8d9097">HTTP only · online, no dot</text>
  </g>
  <use xlink:href="#spark" x="130" y="64" fill="#f0a9c4" fill-opacity="0.8"/>
  <use xlink:href="#spark" x="556" y="186" fill="#f0a88f" fill-opacity="0.8" transform="translate(556 186) scale(0.7) translate(-556 -186)"/>
  <use xlink:href="#spark" x="548" y="58" fill="#f2f1ed" fill-opacity="0.6" transform="translate(548 58) scale(0.55) translate(-548 -58)"/>
</svg>
