name: Discloud prebuilt

# Discloud was compiling the site twice on every upload and taking minutes. This builds it here instead and publishes the
# result to the `discloud` branch: compiled site, launcher, discloud.config and a package.json with no build script.
# Point Discloud at that branch and it only installs the packages and starts.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: discloud-prebuilt
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for Discloud
        run: npm run build:discloud
      - name: Package
        run: npm run package:discloud
      - name: Publish the discloud branch
        run: |
          cd discloud-dist
          git init -q -b discloud
          git config user.name "petto-web build"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" discloud
